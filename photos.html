<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radartube - Photos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8ff;
            color: #14213d;
        }

        header {
            background: #087df5;
            color: white;
            padding: 20px;
            border-radius: 0 0 25px 25px;
        }

        .top {
            display: flex;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 5px;
        }

        nav a {
            text-decoration: none;
            color: #173b70;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 25px;
        }

        nav a.active {
            background: #087df5;
            color: white;
        }

        .main {
            padding: 20px;
        }

        h1 {
            font-size: 30px;
        }

        .subtitle {
            color: #65748b;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        .photo {
            height: 180px;
            border-radius: 18px;
            background: #dcecff;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        footer {
            margin-top: 30px;
            background: #087df5;
            color: white;
            padding: 25px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <div class="top">
            <div class="logo">Radartube</div>
        </div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="photos.html" class="active">Photos</a>
        <a href="services.html">Services</a>
    </nav>

    <div class="main">

        <h1>🖼️ Photos</h1>

        <p class="subtitle">
            Meri Yaadein, Khaas Lamhe ❤️
        </p>

        <div class="gallery">

            <div class="photo">
                <img src="./file_00000000bbcc82079f72666b55715c83.jpg" alt="Photo 1">
            </div>

            <div class="photo">
                <img src="./file_0000000019e082118482aba9399ff998.jpg" alt="Photo 2">
            </div>

            <div class="photo">
                <img src="./IMG_20260926_131101.jpg" alt="Photo 3">
            </div>

        </div>

    </div>

    <footer>
        <h2>Radartube</h2>
        <p>Meri yaadein, meri duniya ❤️</p>
    </footer>

</body>
</html>
