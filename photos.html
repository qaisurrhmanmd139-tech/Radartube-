<style>

body{
    margin:0;
    font-family:Arial,sans-serif;

header{
    background:linear-gradient(135deg,#087df5,#35a4ff);

.gallery{
    display:grid;

.photo{

    border-radius:18px;
    background:linear-gradient(135deg,#087df5,#b8dcff);

    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.placeholder{
    font-size:45px;
}

footer{
    text-align:center;
    padding:25px;
    color:#71809a;
